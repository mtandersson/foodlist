name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.6"
          cache-dependency-path: backend/go.sum
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run backend tests
        working-directory: backend
        run: |
          go mod download
          go test -v -race ./...

      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm run test:run

  release:
    name: Create Release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_head: ${{ steps.semantic.outputs.new_release_git_head }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.6"
          cache-dependency-path: backend/go.sum
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Analyze version with semantic-release
        id: analyze
        run: |
          # Run semantic-release in analyze-only mode to get next version
          # This doesn't create a release, just determines what version would be released
          npx semantic-release --dry-run --extends .releaserc.cjs > semantic-output.txt 2>&1 || true
          # Extract version from output (semantic-release prints "next release version is X.Y.Z")
          RELEASE_VERSION=$(grep -oP 'next release version is \K[0-9]+\.[0-9]+\.[0-9]+' semantic-output.txt || echo "")
          if [ -z "$RELEASE_VERSION" ]; then
            # Fallback: if no version determined, check VERSION file or use default
            if [ -f VERSION ]; then
              RELEASE_VERSION=$(cat VERSION)
            else
              RELEASE_VERSION="dev"
            fi
          fi
          echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "Next release version: $RELEASE_VERSION"
          # Write to VERSION file for use in build steps
          echo "$RELEASE_VERSION" > VERSION

      - name: Build release assets
        run: |
          RELEASE_VERSION="${{ steps.analyze.outputs.version }}"
          echo "Building version: $RELEASE_VERSION"
          
          # Build for multiple platforms
          mkdir -p dist

          # Linux AMD64
          cd backend
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$RELEASE_VERSION" -o ../dist/foodlist-linux-amd64 .

          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=$RELEASE_VERSION" -o ../dist/foodlist-linux-arm64 .

          # macOS AMD64
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=$RELEASE_VERSION" -o ../dist/foodlist-darwin-amd64 .

          # macOS ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=$RELEASE_VERSION" -o ../dist/foodlist-darwin-arm64 .

          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=$RELEASE_VERSION" -o ../dist/foodlist-windows-amd64.exe .

          cd ..

          # Build frontend with version injection
          cd frontend
          npm ci
          RELEASE_VERSION=$RELEASE_VERSION npm run build
          cd ..

          # Create archives for individual binaries
          cd dist
          for binary in foodlist-*; do
            if [[ $binary == *.exe ]]; then
              zip "${binary%.exe}.zip" "$binary"
            else
              tar -czf "${binary}.tar.gz" "$binary"
            fi
          done
          cd ..

      - name: Create full package (pre-release)
        run: |
          # Create a temporary full package that will be renamed by semantic-release
          mkdir -p dist/foodlist-full
          cp -r frontend/dist dist/foodlist-full/frontend
          cp dist/foodlist-linux-amd64 dist/foodlist-full/foodlist
          cd dist
          tar -czf foodlist-full.tar.gz foodlist-full
          rm -rf foodlist-full

      - name: Create release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }} # Use PAT instead of default token for bypassing write permissions to branch
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

  build-and-push:
    name: Build and Push Docker Image
    needs: release
    runs-on: ubuntu-latest
    if: needs.release.outputs.new_release_published == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.new_release_git_head }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.new_release_version }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.new_release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
